<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
          <title id="architecture-title">마주한끼 시스템 아키텍처</title>
          <desc id="architecture-desc">브라우저 클라이언트가 REST와 SockJS·STOMP로 Render의 Spring Boot에 연결되고, 백엔드는 PostgreSQL·Valkey·Supabase Storage와 외부 연동 네 곳에 연결됩니다. 브라우저는 Kakao Maps SDK를 직접 호출합니다.</desc>
          <defs>
      <style>
      #architecture-root {
      /* portfolio.css의 마주한끼 Warm Table 토큰을 이 그림에만 적용합니다. */
      --paper: #faf7f2;
      --ink: #1e2c4a;
      --muted: #505e7f;
      --soft: #505e7f;
      --rule: #e1bfb8;
      --accent: #ae3115;
      --accent-tint: #fff2ed;
      --link: #0b1c30;
      --brand: #ff6b4a;
      --font-sans: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif;
      --font-mono: Consolas, 'Courier New', ui-monospace, monospace; }
      #architecture-root text { fill: #1e2c4a; font-family: 'Pretendard', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif; }
      #architecture-root .zone { fill: rgba(30,44,74,0.02); stroke: #e1bfb8; stroke-width: 1; }
      #architecture-root .zone-name { fill: #505e7f; font-size: 12px; font-weight: 500; }
      #architecture-root .connector { fill: none; stroke: #505e7f; stroke-width: 1.2; marker-end: url(#architecture-arrow); }
      #architecture-root .http { stroke: #0b1c30; marker-end: url(#architecture-arrow-link); }
      #architecture-root .integration { stroke: #0b1c30; stroke-width: 1; stroke-dasharray: 5 4; marker-end: url(#architecture-arrow-link); }
      #architecture-root .label-mask { fill: #faf7f2; }
      #architecture-root .edge-label { fill: #505e7f; font-size: 12px; font-weight: 500; text-anchor: middle; }
      #architecture-root .technical { fill: #505e7f; font: 400 9px Consolas, 'Courier New', ui-monospace, monospace; }
      #architecture-root .latin-label { fill: #505e7f; font: 400 8px Consolas, 'Courier New', ui-monospace, monospace; text-anchor: middle; letter-spacing: 0.06em; }
      #architecture-root .node-mask { fill: #faf7f2; }
      #architecture-root .node-input { fill: rgba(80,94,127,0.10); stroke: #505e7f; }
      #architecture-root .node-focal { fill: #fff2ed; stroke: #ae3115; stroke-width: 1.2; }
      #architecture-root .node-inner { fill: #faf7f2; stroke: #e1bfb8; }
      #architecture-root .node-store { fill: rgba(30,44,74,0.05); stroke: #505e7f; }
      #architecture-root .node-external { fill: rgba(30,44,74,0.03); stroke: rgba(30,44,74,0.30); }
      #architecture-root .node-optional { fill: rgba(30,44,74,0.02); stroke: rgba(30,44,74,0.30); stroke-dasharray: 4 3; }
      #architecture-root .tag-box { fill: #faf7f2; stroke: #e1bfb8; stroke-width: 0.8; }
      #architecture-root .tag { fill: #505e7f; font: 500 8px Consolas, 'Courier New', ui-monospace, monospace; letter-spacing: 0.08em; }
      #architecture-root .node-name { font-size: 12px; font-weight: 600; }
      #architecture-root .node-copy { fill: #505e7f; font-size: 12px; }
      #architecture-root .legend-text { fill: #505e7f; font-size: 12px; }
      </style>
            <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#505e7f"/></marker>
            <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b1c30"/></marker>
          </defs>
          <rect width="1280" height="720" fill="#faf7f2"/>

          <!-- Zones precede all connectors and nodes. These are source groupings, not network security boundaries. -->
          <g data-source-group="service">
            <rect class="zone" x="336" y="140" width="340" height="304" rx="8"/>
            <text class="zone-name" x="360" y="164">백엔드 · Render / Docker</text>
          </g>
          <g data-source-group="datastore">
            <rect class="zone" x="976" y="48" width="280" height="400" rx="8"/>
            <text class="zone-name" x="1000" y="76">저장소</text>
          </g>
          <g data-source-group="external">
            <rect class="zone" x="24" y="492" width="1232" height="148" rx="8"/>
            <text class="zone-name" x="148" y="516">외부 연동 · 검증 도구</text>
          </g>

          <!-- Ten independent connectors. Every node port is distinct. -->
          <g data-source="web" data-target="backend">
            <title>HTTPS · REST API</title>
            <path class="connector http" d="M200 300 H360"/>
            <text class="latin-label" x="280" y="289">HTTPS · REST</text>
          </g>
          <g data-source="web" data-target="backend">
            <title>SockJS · STOMP 채팅·매칭 알림</title>
            <path class="connector http" d="M200 332 H360"/>
            <text class="latin-label" x="280" y="349">SockJS · STOMP</text>
          </g>
          <g data-source="backend" data-target="postgres">
            <title>영속 데이터 읽기·쓰기와 행 잠금</title>
            <path class="connector" d="M664 240 H832 Q840 240 840 232 V148 Q840 140 848 140 H1000"/>
            <text class="edge-label" x="756" y="228">영속 데이터 · 행 잠금</text>
          </g>
          <g data-source="backend" data-target="valkey">
            <title>매칭 대기·제안과 OAuth 교환 코드의 임시 상태 · TTL</title>
            <path class="connector" d="M664 316 H872 Q880 316 880 308 V280 Q880 272 888 272 H1000"/>
            <text class="edge-label" x="776" y="304">매칭·인증 임시 상태 · TTL</text>
          </g>
          <g data-source="backend" data-target="storage">
            <title>프로필 이미지 업로드</title>
            <path class="connector" d="M664 388 H1000"/>
            <text class="edge-label" x="784" y="376">프로필 이미지 업로드</text>
          </g>
          <g data-source="web" data-target="kakao-maps">
            <title>브라우저에서 Kakao Maps SDK 직접 호출</title>
            <path class="connector integration" d="M120 356 V536"/>
            <rect class="label-mask" x="64" y="436" width="112" height="16" rx="2"/>
            <text class="edge-label" x="120" y="448">브라우저 직접 호출</text>
          </g>
          <g data-source="backend" data-target="oauth">
            <title>OAuth2 로그인</title>
            <path class="connector integration" d="M388 432 V536"/>
            <rect class="label-mask" x="336" y="462" width="104" height="16" rx="2"/>
            <text class="edge-label" x="388" y="474">OAuth2 로그인</text>
          </g>
          <g data-source="backend" data-target="kakao-local">
            <title>지도 핀의 행정구역 검증</title>
            <path class="connector integration" d="M584 432 V536"/>
            <text class="edge-label" x="524" y="516">행정구역 검증</text>
          </g>
          <g data-source="backend" data-target="gemini">
            <title>성향 태그 제안·키워드 추출·임베딩</title>
            <path class="connector integration" d="M616 432 V464 Q616 472 624 472 H876 Q884 472 884 480 V536"/>
            <text class="edge-label" x="952" y="516">성향 태그 · 임베딩</text>
          </g>
          <g data-source="backend" data-target="prometheus">
            <title>Actuator 메트릭 노출 (dev)</title>
            <path class="connector integration" d="M648 432 V452 Q648 460 656 460 H1124 Q1132 460 1132 468 V536"/>
            <text class="edge-label" x="1072" y="516">메트릭 노출</text>
          </g>

          <!-- The client keeps its one-node group label without an extra frame. -->
          <g data-node-id="web" data-source-group="client">
            <text class="zone-name" x="40" y="232">프론트엔드</text>
            <text class="zone-name" x="40" y="252">Cloudflare Pages</text>
            <rect class="node-mask" x="40" y="276" width="160" height="80" rx="6"/>
            <rect class="node-input" x="40" y="276" width="160" height="80" rx="6"/>
            <rect class="tag-box" x="52" y="284" width="40" height="12" rx="2"/>
            <text class="tag" x="60" y="293">WEB</text>
            <text class="node-name" x="56" y="316">Vanilla JS · Vite</text>
            <text class="node-copy" x="56" y="340">브라우저 클라이언트</text>
          </g>
          <g data-node-id="backend" data-source-group="service">
            <rect class="node-mask" x="360" y="180" width="304" height="252" rx="6"/>
            <rect class="node-focal" x="360" y="180" width="304" height="252" rx="6"/>
            <rect class="tag-box" x="376" y="196" width="40" height="12" rx="2"/>
            <text class="tag" x="384" y="205">APP</text>
            <text class="node-name" x="384" y="240">Spring Boot</text>
            <text class="node-copy" x="384" y="264">하나의 백엔드 애플리케이션</text>
            <rect class="node-inner" x="384" y="284" width="256" height="56" rx="4"/>
            <text class="node-name" x="400" y="306">STOMP Simple Broker</text>
            <text class="node-copy" x="400" y="328">인스턴스 메모리 · 채팅·매칭 알림</text>
            <rect class="node-inner" x="384" y="352" width="256" height="56" rx="4"/>
            <text class="node-name" x="400" y="374">@Scheduled 작업</text>
            <text class="node-copy" x="400" y="396">제안 만료 · 대기 상태 보정</text>
          </g>
          <g data-node-id="postgres" data-source-group="datastore">
            <rect class="node-mask" x="1000" y="100" width="240" height="80" rx="6"/>
            <rect class="node-store" x="1000" y="100" width="240" height="80" rx="6"/>
            <rect class="tag-box" x="1012" y="108" width="32" height="12" rx="2"/>
            <text class="tag" x="1020" y="117">DB</text>
            <text class="node-name" x="1016" y="144">PostgreSQL</text>
            <text class="technical" x="1016" y="164">Supabase · PostGIS · pgvector</text>
          </g>
          <g data-node-id="valkey" data-source-group="datastore">
            <rect class="node-mask" x="1000" y="232" width="240" height="80" rx="6"/>
            <rect class="node-store" x="1000" y="232" width="240" height="80" rx="6"/>
            <rect class="tag-box" x="1012" y="240" width="40" height="12" rx="2"/>
            <text class="tag" x="1020" y="249">TTL</text>
            <text class="node-name" x="1016" y="276">Valkey</text>
            <text class="node-copy" x="1016" y="300">Aiven · Redis 호환 / TLS</text>
          </g>
          <g data-node-id="storage" data-source-group="datastore">
            <rect class="node-mask" x="1000" y="348" width="240" height="80" rx="6"/>
            <rect class="node-store" x="1000" y="348" width="240" height="80" rx="6"/>
            <rect class="tag-box" x="1012" y="356" width="56" height="12" rx="2"/>
            <text class="tag" x="1020" y="365">OBJECT</text>
            <text class="node-name" x="1016" y="392">Supabase Storage</text>
            <text class="node-copy" x="1016" y="416">S3 호환 API · 이미지 객체</text>
          </g>
          <g data-node-id="kakao-maps" data-source-group="external">
            <rect class="node-mask" x="40" y="536" width="200" height="80" rx="6"/>
            <rect class="node-external" x="40" y="536" width="200" height="80" rx="6"/>
            <rect class="tag-box" x="52" y="544" width="32" height="12" rx="2"/>
            <text class="tag" x="60" y="553">MAP</text>
            <text class="node-name" x="56" y="576">Kakao Maps JS SDK</text>
            <text class="node-copy" x="56" y="600">지도 표시 · 장소 검색</text>
          </g>
          <g data-node-id="oauth" data-source-group="external">
            <rect class="node-mask" x="288" y="536" width="200" height="80" rx="6"/>
            <rect class="node-external" x="288" y="536" width="200" height="80" rx="6"/>
            <rect class="tag-box" x="300" y="544" width="56" height="12" rx="2"/>
            <text class="tag" x="308" y="553">OAUTH2</text>
            <text class="node-name" x="304" y="576">Kakao / Google</text>
            <text class="node-copy" x="304" y="600">소셜 로그인</text>
          </g>
          <g data-node-id="kakao-local" data-source-group="external">
            <rect class="node-mask" x="536" y="536" width="200" height="80" rx="6"/>
            <rect class="node-external" x="536" y="536" width="200" height="80" rx="6"/>
            <rect class="tag-box" x="548" y="544" width="40" height="12" rx="2"/>
            <text class="tag" x="556" y="553">REST</text>
            <text class="node-name" x="552" y="576">Kakao Local API</text>
            <text class="node-copy" x="552" y="600">좌표 → 행정구역 변환</text>
          </g>
          <g data-node-id="gemini" data-source-group="external">
            <rect class="node-mask" x="784" y="536" width="200" height="80" rx="6"/>
            <rect class="node-optional" x="784" y="536" width="200" height="80" rx="6"/>
            <rect class="tag-box" x="796" y="544" width="64" height="12" rx="2"/>
            <text class="tag" x="804" y="553">OPTIONAL</text>
            <text class="node-name" x="800" y="576">Gemini · Spring AI</text>
            <text class="node-copy" x="800" y="600">선택 설정 · 기본 비활성</text>
          </g>
          <g data-node-id="prometheus" data-source-group="external">
            <rect class="node-mask" x="1032" y="536" width="200" height="80" rx="6"/>
            <rect class="node-external" x="1032" y="536" width="200" height="80" rx="6"/>
            <rect class="tag-box" x="1044" y="544" width="48" height="12" rx="2"/>
            <text class="tag" x="1052" y="553">LOCAL</text>
            <text class="node-name" x="1048" y="576">Prometheus · Grafana</text>
            <text class="node-copy" x="1048" y="600">로컬 측정 · 운영 비노출</text>
          </g>

          <!-- Bottom legend is outside the component area. -->
          <line x1="40" y1="660" x2="1240" y2="660" stroke="#e1bfb8"/>
          <line x1="40" y1="680" x2="72" y2="680" stroke="#505e7f" stroke-width="1.2"/>
          <text class="legend-text" x="84" y="684">주요 요청·저장소 연결</text>
          <line x1="304" y1="680" x2="336" y2="680" stroke="#0b1c30" stroke-dasharray="5 4"/>
          <text class="legend-text" x="348" y="684">외부 연동·검증 도구 연결</text>
          <rect x="652" y="672" width="20" height="16" rx="2" fill="#fff2ed" stroke="#ae3115"/>
          <text class="legend-text" x="684" y="684">백엔드</text>
          <rect x="812" y="672" width="20" height="16" rx="2" fill="rgba(30,44,74,0.05)" stroke="#505e7f"/>
          <text class="legend-text" x="844" y="684">저장소</text>
          <rect x="1020" y="672" width="20" height="16" rx="2" fill="rgba(30,44,74,0.02)" stroke="#505e7f" stroke-dasharray="4 3"/>
          <text class="legend-text" x="1052" y="684">선택 설정</text>
          <text class="legend-text" x="40" y="708">점선은 비동기 호출을 뜻하지 않습니다. 화살표는 연결을 시작하는 쪽에서 대상 쪽으로 향합니다.</text>
        </svg>
